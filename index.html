<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>섹터 자금흐름 대시보드</title>
<meta name="description" content="섹터별 자금흐름 · 뉴스 트래킹 · 하락 히스토리 대시보드">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand"><span class="brand-dot"></span>섹터 자금흐름</div>
      <div class="topbar-right">
        <span class="update-time" id="updateTime">방금 업데이트</span>
        <button class="refresh-btn" id="settingsBtn" title="설정">⚙️</button>
        <button class="refresh-btn" id="refreshBtn" title="새로고침">⟳</button>
      </div>
    </div>
  </header>

  <div class="demo-banner" id="statusBanner"></div>

  <nav class="tabs" id="tabs">
    <button class="tab-btn active" data-page="flow">섹터 자금흐름</button>
    <button class="tab-btn" data-page="history">하락 히스토리</button>
    <button class="tab-btn" data-page="signal">선제 신호</button>
  </nav>

  <main class="page-container" id="pageContainer"></main>

  <footer class="app-footer">
    섹터 자금흐름 대시보드 · 데이터 출처: 네이버금융/뉴스 (연동 시) 또는 샘플
  </footer>
</div>

<nav class="bottom-nav">
  <button class="bottom-nav-btn active" data-page="flow"><span class="bn-icon">📊</span>자금흐름</button>
  <button class="bottom-nav-btn" data-page="history"><span class="bn-icon">🗓️</span>히스토리</button>
  <button class="bottom-nav-btn" data-page="signal"><span class="bn-icon">🔍</span>선제신호</button>
</nav>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box" id="modalBox"></div>
</div>

<script src="app.js"></script>
</body>
</html>
