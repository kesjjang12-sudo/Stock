<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>섹터 자금흐름 대시보드</title>
<meta name="description" content="섹터별 자금흐름 · 뉴스 트래킹 · 하락 히스토리 대시보드">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand"><span class="brand-dot"></span>섹터 자금흐름</div>
      <div class="topbar-right">
        <span class="update-time" id="updateTime">방금 업데이트</span>
        <button class="refresh-btn" id="refreshBtn" title="새로고침">⟳</button>
      </div>
    </div>
  </header>

  <div class="demo-banner">
    <span class="demo-banner-badge">DEMO</span>
    지금은 <b>샘플 데이터</b>로 화면만 구성한 상태예요. 실제 시세 · 수급 · 뉴스는 추후 API 연동 예정입니다.
  </div>

  <nav class="tabs" id="tabs">
    <button class="tab-btn active" data-page="flow">섹터 자금흐름</button>
    <button class="tab-btn" data-page="history">하락 히스토리</button>
    <button class="tab-btn" data-page="signal">선제 신호</button>
  </nav>

  <main class="page-container" id="pageContainer"></main>

  <footer class="app-footer">
    섹터 자금흐름 대시보드 · 샘플 데이터 기반 데모
  </footer>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box" id="modalBox"></div>
</div>

<script src="app.js"></script>
</body>
</html>
